[package]
name = "lexena-mcp"
version = "3.3.0-beta.1"
edition = "2021"

[dependencies]
lexena-mcp-ipc = { path = "../mcp-ipc" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version="0.4", features=["serde"] }
tempfile = "3"

[[bin]]
name = "lexena-mcp"
path = "src/main.rs"
