[package]
name = "lexena-mcp-ipc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
getrandom = "=0.4.3"
zeroize = "1"
thiserror = "1"
atomicwrites = "=0.4.4"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3"
