name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mcp-packaging
      - run: pnpm mcp:packaging:check
      - run: pnpm test
      - run: pnpm build

  cargo-test:
    name: Rust tests (cargo test)
    # The pinned cmake crate cannot auto-detect Visual Studio 2026.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Configure native Windows build dependencies
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Portable ZIP, manifest and packaging tests on Windows
        run: pnpm test:mcp-packaging
      - name: Standalone IPC and bridge tests (locked)
        run: |
          cargo test --locked --manifest-path src-tauri/crates/mcp-ipc/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/crates/mcp-bridge/Cargo.toml
      - name: Stage exact Windows sidecar before Tauri build script
        run: pnpm mcp:bridge:build --target x86_64-pc-windows-msvc
      - name: cargo test (no-default-features, skip vulkan)
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target
        run: cargo test --locked --no-default-features --lib

  deno-test:
    name: Edge functions tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run all tests in supabase/functions
        run: deno test --allow-env --allow-net --allow-read --config supabase/functions/deno.json supabase/functions/

  pgtap:
    name: Database tests (pgtap)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the project's devDependency version (package.json) instead of
          # `latest`: a newer CLI stopped applying Supabase's default GRANTs to the
          # `authenticated`/`anon` roles, breaking every RLS pgtap test with
          # "permission denied for table ...". Keep in sync with the supabase devDep.
          version: 2.95.2
      - name: Start local Supabase
        run: supabase start
      - name: Run pgtap suite
        run: supabase test db
      - name: Stop Supabase
        if: always()
        run: supabase stop
